# 物流定价系统 — Nginx 站点配置模板（React SPA + FastAPI）
#
# 用法：
#   1) 把域名换成你自己的（cbprice.cn 是原作者域名，已停运）：
#        sed 's/cbprice\.cn/your-domain.com/g' nginx-cbprice.conf | sudo tee /etc/nginx/sites-available/your-app.conf
#   2) 证书路径（ssl_certificate / ssl_certificate_key）改成你自己的
#   3) 后端地址默认 127.0.0.1:8003，如 gunicorn 端口不同请一并修改
#   4) 软链到 sites-enabled 并验证：
#        sudo ln -sf /etc/nginx/sites-available/your-app.conf /etc/nginx/sites-enabled/
#        sudo nginx -t && sudo systemctl reload nginx
#

# ===== 全局限流/连接区（http 上下文指令） =====
# 按客户端 IP 建立共享内存区：api_zone 允许常规 API 20r/s，配合 location 内 burst
# 吸收短时页面并发；conn_zone 限制单 IP 并发连接，防止单点压垮 gunicorn worker。
# 微信支付回调 location 不启用 limit_req，避免官方重试回调被误限。
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=conn_zone:10m;

# HTTP → HTTPS 重定向
server {
    listen 80;
    listen [::]:80;
    server_name cbprice.cn www.cbprice.cn;
    return 301 https://www.cbprice.cn$request_uri;
}

# HTTPS 主配置
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cbprice.cn www.cbprice.cn;

    # ===== SSL =====
    ssl_certificate     /etc/nginx/ssl/ssl_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/ssl_private.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling：减少客户端证书链校验延迟并提升吊销状态可见性。
    # fullchain 已包含中间证书，因此不额外配置 ssl_trusted_certificate，避免路径漂移。
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # ===== 安全头 =====
    # HSTS: 强制浏览器后续使用 HTTPS，降低降级攻击风险。
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # nosniff: 禁止 MIME sniffing，降低脚本/样式类型混淆风险。
    add_header X-Content-Type-Options "nosniff" always;
    # SAMEORIGIN: 允许同源管理页/支付页嵌入，拒绝第三方点击劫持。
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Referrer-Policy: 跨站仅发送 origin，减少 URL 参数泄露。
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Permissions-Policy: 仅支付能力同源可用，禁用地理位置/麦克风/摄像头。
    add_header Permissions-Policy "payment=(self), geolocation=(), microphone=(), camera=()" always;
    # COOP/CORP: 隔离浏览上下文与资源读取范围；不启用 COEP，避免破坏微信 iframe/SDK。
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    # CSP: 保守同源策略。Vite/React 构建产物、历史内联 bootstrap 与微信 SDK 兼容性仍需
    # unsafe-inline/unsafe-eval；connect-src 显式允许微信 API。后续移除内联脚本后可再收紧。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://api.weixin.qq.com; frame-ancestors 'self'; base-uri 'self';" always;

    # ===== 真实客户端 IP =====
    # 仅信任本机反向代理；未知 CDN/上游不得加入，避免信任客户端伪造 X-Forwarded-For。
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # ===== Gzip 压缩 =====
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml
               application/rss+xml image/svg+xml;

    # ===== React SPA 静态文件 =====
    root /var/www/ozon-pricing-private/frontend/dist;
    index index.html;

    # 静态资源（Vite 生成的带 hash 文件名，长缓存）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 永不缓存（防止旧 SPA bundle 残留）
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        # 重新声明安全头（add_header 在子 location 里会覆盖父级，不重声明会丢）
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "payment=(self), geolocation=(), microphone=(), camera=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://api.weixin.qq.com; frame-ancestors 'self'; base-uri 'self';" always;
    }

    # ===== FastAPI 后端 API =====
    # 微信支付回调必须独立于通用 API 限流，避免官方重试/集中回调被 limit_req 拦截。
    location = /api/payment/wechat/notify {
        proxy_pass http://127.0.0.1:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        # 常规 API 每 IP 20r/s，burst=40 吸收短时间页面并发；nodelay 避免排队拖慢前端。
        # 单 IP 同时最多 30 个连接，防止异常客户端耗尽 gunicorn worker。
        limit_req zone=api_zone burst=40 nodelay;
        limit_conn conn_zone 30;

        proxy_pass http://127.0.0.1:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 支持（定价计算进度）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;

        # 文件上传大小限制（产品/物流导入）
        client_max_body_size 10m;
    }

    # ===== 微信支付回调 =====
    # FastAPI 直接处理，不再转发到旧的 8081 端口
    location /wechat/notify {
        proxy_pass http://127.0.0.1:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ===== 安全：屏蔽敏感路径 =====
    location ~ /\.git {
        deny all;
        return 404;
    }
    location ~ /\.env {
        deny all;
        return 404;
    }
    location ~ /\.ht {
        deny all;
        return 404;
    }
    location = /alembic.ini {
        deny all;
        return 404;
    }
    location ~ ^/(tests|alembic|deploy|scripts|__pycache__)/ {
        deny all;
        return 404;
    }

    # 屏蔽常见扫描目标
    location ~ ^/(wp-admin|wp-login|wp-content|xmlrpc|phpmyadmin|admin\.php) {
        return 444;
    }

    # ===== robots.txt =====
    location = /robots.txt {
        return 200 "User-agent: *\nDisallow: /api/\nAllow: /\n";
        add_header Content-Type text/plain;
    }

    # ===== SPA 前端路由 fallback =====
    # 所有未匹配的路径都交给 React Router 处理（最终落到 /index.html，会触发 location = /index.html 的 no-cache header）
    location / {
        try_files $uri $uri/ /index.html;
        # fallback 到 index.html 时，nginx 内部子请求会重新走 location 匹配，命中 = /index.html
        # 但首页 / 直接由 index 指令服务时，不一定走子请求 → 这里也显式声明 no-cache 兜底
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "payment=(self), geolocation=(), microphone=(), camera=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://api.weixin.qq.com; frame-ancestors 'self'; base-uri 'self';" always;
    }
}
