# CBPrice Nginx Configuration — React SPA + FastAPI
# 替换 /etc/nginx/sites-enabled/cbprice.cn

# HTTP → HTTPS 重定向
server {
    listen 80;
    listen [::]:80;
    server_name cbprice.cn www.cbprice.cn;
    return 301 https://www.cbprice.cn$request_uri;
}

# HTTPS 主配置
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cbprice.cn www.cbprice.cn;

    # ===== SSL =====
    ssl_certificate     /etc/nginx/ssl/ssl_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/ssl_private.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ===== 安全头 =====
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ===== 真实客户端 IP =====
    # 仅信任本机反向代理；未知 CDN/上游不得加入，避免信任客户端伪造 X-Forwarded-For。
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # ===== Gzip 压缩 =====
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml
               application/rss+xml image/svg+xml;

    # ===== React SPA 静态文件 =====
    root /var/www/ozon-pricing/frontend/dist;
    index index.html;

    # 静态资源（Vite 生成的带 hash 文件名，长缓存）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 永不缓存（防止旧 SPA bundle 残留）
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        # 重新声明安全头（add_header 在子 location 里会覆盖父级，不重声明会丢）
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ===== FastAPI 后端 API =====
    location /api/ {
        proxy_pass http://127.0.0.1:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 支持（定价计算进度）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;

        # 文件上传大小限制（产品/物流导入）
        client_max_body_size 10m;
    }

    # ===== 微信支付回调 =====
    # FastAPI 直接处理，不再转发到旧的 8081 端口
    location /wechat/notify {
        proxy_pass http://127.0.0.1:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ===== 安全：屏蔽敏感路径 =====
    location ~ /\.git {
        deny all;
        return 404;
    }
    location ~ /\.env {
        deny all;
        return 404;
    }
    location ~ /\.ht {
        deny all;
        return 404;
    }
    location = /alembic.ini {
        deny all;
        return 404;
    }
    location ~ ^/(tests|alembic|deploy|scripts|__pycache__)/ {
        deny all;
        return 404;
    }

    # 屏蔽常见扫描目标
    location ~ ^/(wp-admin|wp-login|wp-content|xmlrpc|phpmyadmin|admin\.php) {
        return 444;
    }

    # ===== robots.txt =====
    location = /robots.txt {
        return 200 "User-agent: *\nDisallow: /api/\nAllow: /\n";
        add_header Content-Type text/plain;
    }

    # ===== SPA 前端路由 fallback =====
    # 所有未匹配的路径都交给 React Router 处理（最终落到 /index.html，会触发 location = /index.html 的 no-cache header）
    location / {
        try_files $uri $uri/ /index.html;
        # fallback 到 index.html 时，nginx 内部子请求会重新走 location 匹配，命中 = /index.html
        # 但首页 / 直接由 index 指令服务时，不一定走子请求 → 这里也显式声明 no-cache 兜底
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
