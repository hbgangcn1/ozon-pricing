[server]
# 启用 XSRF 保护（推荐）
enableXsrfProtection = true
# 启用 CORS（与 XSRF 保护兼容）
enableCORS = true
# 端口设置
port = 8501
# 最大上传文件大小（200MB）
maxUploadSize = 200
# 禁用文件变更监控，避免频繁自动重启（生产环境）
fileWatcherType = "none"

[browser]
# 自动打开浏览器（生产环境建议设为 false）
gatherUsageStats = false

[logger]
# 日志级别设置（过滤警告信息）
level = "error"
messageFormat = "%(asctime)s %(message)s"

[theme]
# 主题设置
primaryColor = "#FF6B6B"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F2F6"
textColor = "#262730"
