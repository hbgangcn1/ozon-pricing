[pytest]
# 过滤各类警告
filterwarnings =
    # pandas兼容性警告
    ignore::UserWarning:pandas
    ignore:pandas only supports SQLAlchemy:UserWarning
    # 数据库连接资源警告（测试夹具清理时序导致）
    ignore:unclosed database:ResourceWarning
    ignore:unclosed.*ssl:ResourceWarning
    # Streamlit测试模式警告
    ignore:missing ScriptRunContext:UserWarning

# 排除非测试文件
python_files = test_*.py *_test.py
norecursedirs = .git __pycache__ .pytest_cache htmlcov .venv backups logs ml_demo base docs frontend
testpaths = tests

# 默认配置
addopts = 
    -v
    --tb=short
    --durations=10
    -ra
    -p no:randomly
    -n 4
    --dist=loadscope
    --timeout=120
    --timeout-method=thread

# 并行测试配置 (使用: pytest -n auto 或 pytest -n 4)
# 默认不启用并行，需要手动指定 -n 参数

# 异步测试配置
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

# 注册自定义标记
markers =
    unit: 标记为单元测试
    integration: 标记为集成测试
    ui: 标记为UI测试
    asyncio: 标记为异步测试

# 覆盖率配置 (使用: pytest --cov)
# cov_source = .
# cov_report = term-missing:skip-covered
# cov_fail_under = 90

# 日志配置
log_cli = true
log_cli_level = DEBUG

